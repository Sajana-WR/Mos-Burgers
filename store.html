<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mos Burgers Shop</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <!-- Custom CSS -->
    

    <style>

    .carousel img {
        height: 500px;
        object-fit: cover;
    }

    /* Table */
    .table-responsive {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    #tblStore {
        min-width: 700px;
    }

    /* Mobile */
    @media (max-width: 576px) {

        .carousel img {
            height: 250px;
        }

        #tblStore {
            min-width: 700px;
        }

    }

</style>

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg bg-danger">

        <div class="container-fluid">

            <!-- Brand -->
            <a class="navbar-brand" href="index.html">
                Mos Burgers Shop
            </a>

            <!-- Mobile menu button -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Navigation links -->
            <div
                class="collapse navbar-collapse justify-content-end"
                id="navbarNav">

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a
                            class="nav-link active"
                            aria-current="page"
                            href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="store.html">
                            Store
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="customer.html">
                            Customers
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="order.html">
                            Orders
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="report.html">
                            Reports
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- ================= CAROUSEL ================= -->

    <div
        id="carouselExample"
        class="carousel slide"
        data-bs-ride="carousel">

        <div class="carousel-inner">

            <!-- Image 1 -->
            <div class="carousel-item active">

                <img
                    src="img/img7.jpg"
                    class="d-block w-100"
                    alt="Mos Burgers">

            </div>


            <!-- Image 2 -->
            <div class="carousel-item">

                <img
                    src="img/img8.jpg"
                    class="d-block w-100"
                    alt="Mos Burgers">

            </div>


            <!-- Image 3 -->
            <div class="carousel-item">

                <img
                    src="img/img9.jpg"
                    class="d-block w-100"
                    alt="Mos Burgers">

            </div>


            <!-- Image 4 -->
            <div class="carousel-item">

                <img
                    src="img/img10.jpg"
                    class="d-block w-100"
                    alt="Mos Burgers">

            </div>


            <!-- Image 5 -->
            <div class="carousel-item">

                <img
                    src="img/img11.jpg"
                    class="d-block w-100"
                    alt="Mos Burgers">

            </div>

        </div>


        <!-- Previous button -->
        <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>

            <span class="visually-hidden">
                Previous
            </span>

        </button>


        <!-- Next button -->
        <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>

            <span class="visually-hidden">
                Next
            </span>

        </button>

    </div>


    <!-- ================= ADD ITEM FORM ================= -->

    <div class="container-fluid mt-5">

        <div class="row g-3">

            <!-- Item Code -->
            <div class="col-12 col-md-6 col-lg-2">

                <input
                    type="text"
                    id="txtIcode"
                    class="form-control"
                    placeholder="Item code">

            </div>


            <!-- Item Name -->
            <div class="col-12 col-md-6 col-lg-2">

                <input
                    type="text"
                    id="txtName"
                    class="form-control"
                    placeholder="Item name">

            </div>


            <!-- Category -->
            <div class="col-12 col-md-6 col-lg-2">

                <div class="dropdown">

                    <button
                        id="categoryBtn"
                        class="btn btn-secondary dropdown-toggle w-100"
                        type="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">

                        Categories

                    </button>


                    <ul class="dropdown-menu w-100">

                        <li>
                            <a
                                class="dropdown-item"
                                href="#"
                                onclick="selectCategory('Burgers')">

                                Burgers

                            </a>
                        </li>


                        <li>
                            <a
                                class="dropdown-item"
                                href="#"
                                onclick="selectCategory('Submarines')">

                                Submarines

                            </a>
                        </li>


                        <li>
                            <a
                                class="dropdown-item"
                                href="#"
                                onclick="selectCategory('Fries')">

                                Fries

                            </a>
                        </li>


                        <li>
                            <a
                                class="dropdown-item"
                                href="#"
                                onclick="selectCategory('Pasta')">

                                Pasta

                            </a>
                        </li>


                        <li>
                            <a
                                class="dropdown-item"
                                href="#"
                                onclick="selectCategory('Chicken')">

                                Chicken

                            </a>
                        </li>


                        <li>
                            <a
                                class="dropdown-item"
                                href="#"
                                onclick="selectCategory('Beverages')">

                                Beverages

                            </a>
                        </li>

                    </ul>

                </div>

            </div>


            <!-- Price -->
            <div class="col-12 col-md-6 col-lg-2">

                <input
                    type="text"
                    id="txtPrice"
                    class="form-control"
                    placeholder="Price">

            </div>


            <!-- Discount -->
            <div class="col-12 col-md-6 col-lg-2">

                <input
                    type="text"
                    id="txtDiscount"
                    class="form-control"
                    placeholder="Discount (%)">

            </div>


            <!-- Quantity -->
            <div class="col-12 col-md-6 col-lg-2">

                <input
                    type="text"
                    id="txtQty"
                    class="form-control"
                    placeholder="Quantity">

            </div>


            <!-- Expiration Date -->
            <div class="col-12 col-md-6 col-lg-2">

                <input
                    type="date"
                    id="txtDate"
                    class="form-control">

            </div>


            <!-- Add Button -->
            <div class="col-12 col-md-6 col-lg-2">

                <input
                    type="button"
                    id="btnAdd"
                    onclick="addTbl()"
                    class="btn btn-danger w-100"
                    value="Add">

            </div>

        </div>

    </div>


    <!-- ================= TABLE ================= -->

    <div class="container-fluid mt-4">

        <div class="table-responsive">

            <table
                id="tblStore"
                class="table table-bordered table-striped">

            </table>

        </div>

    </div>


    <!-- ================= BOOTSTRAP JS ================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>


    <!-- Your JavaScript -->
    <script src="js/store.js"></script>

</body>

</html>
