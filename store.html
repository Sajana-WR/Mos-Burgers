<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">
    </head>
    <body>

        <div class="navba bg-danger">
            <nav class="navbar navbar-expand-lg bg-gradient">
                <div class="container-fluid gap-5">
                    <a class="navbar-brand" href="/index.html">Mos Burgers
                        Shop</a>
                    <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse justify-content-end"
                        id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page"
                                    href="/index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/store.html">Store</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link"
                                    href="/customer.html">Customers</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link"
                                    href="/order.html">Orders</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link"
                                    href="/report.html">Reports</a>
                            </li>

                        </ul>
                    </div>
                </div>
            </nav>
        </div>

        <div id="carouselExample"
            class="carousel slide mx-auto"
            style="width:700px;"
            data-bs-ride="carousel">

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="img/img7.jpg" class="d-block w-100" alt>
                </div>

                <div class="carousel-item">
                    <img src="img/img8.jpg" class="d-block w-100" alt>
                </div>

                <div class="carousel-item">
                    <img src="img/img9.jpg" class="d-block w-100" alt>
                </div>

                <div class="carousel-item">
                    <img src="img/img10.jpg" class="d-block w-100" alt>
                </div>

                <div class="carousel-item">
                    <img src="img/img11.jpg" class="d-block w-100" alt>
                </div>

            </div>

            <button class="carousel-control-prev"
                type="button"
                data-bs-target="#carouselExample"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next"
                type="button"
                data-bs-target="#carouselExample"
                data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>

        </div>

        <div class="d-flex gap-2 mt-5 align-items-center">

            <input type="text" id="txtIcode" placeholder="item code">
            <input type="text" id="txtName" placeholder="item name">
            <div class="dropdown">
                <button id="categoryBtn"
                    class="btn btn-secondary dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">
                    Categories
                </button>

                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#"
                            onclick="selectCategory('Burgers')">Burgers</a></li>
                    <li><a class="dropdown-item" href="#"
                            onclick="selectCategory('Submarines')">Submarines</a></li>
                    <li><a class="dropdown-item" href="#"
                            onclick="selectCategory('Fries')">Fries</a></li>
                    <li><a class="dropdown-item" href="#"
                            onclick="selectCategory('Pasta')">Pasta</a></li>
                    <li><a class="dropdown-item" href="#"
                            onclick="selectCategory('Chicken')">Chicken</a></li>
                    <li><a class="dropdown-item" href="#"
                            onclick="selectCategory('Beverages')">Beverages</a></li>
                </ul>
            </div>
            <input type="text" id="txtPrice" placeholder="price">
            <input type="text" id="txtDiscount" placeholder="discount(%)">
            <input type="text" id="txtQty" placeholder="quantity">
            <input type="date" id="txtDate" placeholder="expiration dates ">
            <input type="button" id="btnAdd" onclick="addTbl()"
                style="background-color: red; width: 100px;" value="add">

        </div>

        <table id="tblStore" class="table table-bordered table-striped">

        </table>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

        <script src="js/store.js"></script>
    </body>
</html>
