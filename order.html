<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport"
            content="width=device-width, initial-scale=1.0">

        <title>Mos Burgers - Orders</title>

        <!-- Bootstrap CSS -->

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">

        <!-- Custom CSS -->

        <style>

        /* =========================
           CAROUSEL
        ========================= */

        .order-carousel {
            width: 500px;
            max-width: 100%;
            margin: 0 auto;
        }


        .order-carousel img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }


        /* =========================
           ORDER FORM
        ========================= */

        .order-form {
            margin-top: 40px;
        }


        /* =========================
           TABLE
        ========================= */

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }


        #tblOrder {
            min-width: 800px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 576px) {

            .order-carousel {
                width: 100%;
            }


            .order-carousel img {
                height: 250px;
            }


            .order-form {
                margin-top: 30px;
            }


            #tblOrder {
                min-width: 800px;
            }

        }

    </style>

    </head>

    <body>

        <!-- =========================
         NAVBAR
    ========================= -->

        <nav class="navbar navbar-expand-lg bg-danger">

            <div class="container-fluid">

                <!-- Brand -->

                <a class="navbar-brand" href="index.html">

                    Mos Burgers Shop

                </a>

                <!-- Mobile button -->

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <!-- Navigation -->

                <div
                    class="collapse navbar-collapse justify-content-end"
                    id="navbarNav">

                    <ul class="navbar-nav">

                        <!-- Home -->

                        <li class="nav-item">

                            <a
                                class="nav-link"
                                href="index.html">

                                Home

                            </a>

                        </li>

                        <!-- Store -->

                        <li class="nav-item">

                            <a
                                class="nav-link"
                                href="store.html">

                                Store

                            </a>

                        </li>

                        <!-- Customers -->

                        <li class="nav-item">

                            <a
                                class="nav-link"
                                href="customer.html">

                                Customers

                            </a>

                        </li>

                        <!-- Orders -->

                        <li class="nav-item">

                            <a
                                class="nav-link active"
                                aria-current="page"
                                href="order.html">

                                Orders

                            </a>

                        </li>

                        <!-- Reports -->

                        <li class="nav-item">

                            <a
                                class="nav-link"
                                href="report.html">

                                Reports

                            </a>

                        </li>

                    </ul>

                </div>

            </div>

        </nav>

        <!-- =========================
         CAROUSEL
    ========================= -->

        <div
            id="carouselExampleControlsNoTouching"
            class="carousel slide order-carousel"
            data-bs-ride="carousel"
            data-bs-interval="3000">

            <div class="carousel-inner">

                <!-- Image 1 -->

                <div class="carousel-item active">

                    <img
                        src="img/img7.jpg"
                        class="d-block w-100"
                        alt="Food">

                </div>

                <!-- Image 2 -->

                <div class="carousel-item">

                    <img
                        src="img/img9.jpg"
                        class="d-block w-100"
                        alt="Food">

                </div>

                <!-- Image 3 -->

                <div class="carousel-item">

                    <img
                        src="img/img10.jpg"
                        class="d-block w-100"
                        alt="Food">

                </div>

            </div>

            <!-- Previous -->

            <button
                class="carousel-control-prev"
                type="button"
                data-bs-target="#carouselExampleControlsNoTouching"
                data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

                <span class="visually-hidden">
                    Previous
                </span>

            </button>

            <!-- Next -->

            <button
                class="carousel-control-next"
                type="button"
                data-bs-target="#carouselExampleControlsNoTouching"
                data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

                <span class="visually-hidden">
                    Next
                </span>

            </button>

        </div>

        <!-- =========================
         SEARCH SECTION
    ========================= -->

        <div class="container mt-5">

            <!-- SEARCH ITEM -->

            <div class="row g-3 align-items-center">

                <div class="col-12 col-md-4">

                    <label
                        for="txtCode"
                        class="form-label fw-bold">

                        Search Item

                    </label>

                </div>

                <div class="col-12 col-md-8">

                    <div class="input-group">

                        <input
                            id="txtCode"
                            type="text"
                            class="form-control"
                            placeholder="Name / Code / Category">

                        <input
                            type="button"
                            class="btn btn-danger"
                            value="Search"
                            onclick="SearchOrder()">

                    </div>

                </div>

            </div>

            <!-- SEARCH CUSTOMER -->

            <div class="row g-3 align-items-center mt-4">

                <div class="col-12 col-md-4">

                    <label
                        for="txtId"
                        class="form-label fw-bold">

                        Search Customer

                    </label>

                </div>

                <div class="col-12 col-md-8">

                    <div class="input-group">

                        <input
                            id="txtId"
                            type="text"
                            class="form-control"
                            placeholder="Customer ID / Contact Number">

                        <input
                            type="button"
                            class="btn btn-danger"
                            value="Search"
                            onclick="SearchCustomer()">

                    </div>

                </div>

            </div>

        </div>

        <!-- =========================
         ADD ORDER FORM
    ========================= -->

        <div class="container order-form">

            <div class="row g-3">

                <!-- Order ID -->

                <div class="col-12 col-md-6 col-lg-3">

                    <input
                        id="txtOid"
                        type="text"
                        class="form-control"
                        placeholder="Order ID">

                </div>

                <!-- Customer Name -->

                <div class="col-12 col-md-6 col-lg-3">

                    <input
                        id="txtCusName"
                        type="text"
                        class="form-control"
                        placeholder="Customer Name">

                </div>

                <!-- Item Name -->

                <div class="col-12 col-md-6 col-lg-3">

                    <input
                        id="txtItemName"
                        type="text"
                        class="form-control"
                        placeholder="Enter Item Name">

                </div>

                <!-- Quantity -->

                <div class="col-12 col-md-6 col-lg-3">

                    <input
                        id="txtQty"
                        type="number"
                        class="form-control"
                        placeholder="Quantity">

                </div>

                <!-- Discount -->

                <div class="col-12 col-md-6 col-lg-3">

                    <input
                        id="txtDis"
                        type="text"
                        class="form-control"
                        placeholder="Discount">

                </div>

                <!-- Price -->

                <div class="col-12 col-md-6 col-lg-3">

                    <input
                        id="txtpri"
                        type="text"
                        class="form-control"
                        placeholder="Price">

                </div>

                <!-- Add Order -->

                <div class="col-12 col-md-6 col-lg-3">

                    <input
                        id="btnAdd"
                        type="button"
                        class="btn btn-danger w-100"
                        value="Add Order"
                        onclick="addOrder()">

                </div>

            </div>

        </div>

        <!-- =========================
         ORDER TABLE
    ========================= -->

        <div class="container-fluid mt-5">

            <div class="table-responsive">

                <table
                    id="tblOrder"
                    class="table table-bordered table-striped">

                </table>

            </div>

        </div>

        <!-- =========================
         YOUR JAVASCRIPT
    ========================= -->

        <script src="js/order.js"></script>

        <!-- Bootstrap JS -->

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous">
    </script>

    </body>

</html>
