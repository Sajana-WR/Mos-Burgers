<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous">
    </head>
    <body>

        <div>
            <nav class="navbar navbar-expand-lg bg-danger">
                <div class="container-fluid gap-5">
                    <a class="navbar-brand" href="/index.html">Mos Burgers
                        Shop</a>
                    <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false"
                        aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse justify-content-end"
                        id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page"
                                    href="/index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/store.html">Store</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link"
                                    href="/customer.html">Customers</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link"
                                    href="/order.html">Orders</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link"
                                    href="/report.html">Reports</a>
                            </li>

                        </ul>
                    </div>
                </div>
            </nav>
        </div>

        <div id="carouselExampleControlsNoTouching "
            class="carousel slide d-flex mx-auto"
            data-bs-ride="carousel"
            data-bs-interval="3000"
            style="width: 500px;">

            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="img/img7.jpg" class="d-block w-100" alt="Image 1">
                </div>

                <div class="carousel-item">
                    <img src="img/img9.jpg" class="d-block w-100" alt="Image 2">
                </div>

                <div class="carousel-item">
                    <img src="img/img10.jpg" class="d-block w-100"
                        alt="Image 3">
                </div>
            </div>

            <button class="carousel-control-prev" type="button"
                data-bs-target="#carouselExampleControlsNoTouching"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" type="button"
                data-bs-target="#carouselExampleControlsNoTouching"
                data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>

        </div>


        <div class="container">
            <div class="row">
                <td>Search Item</Search></td>

                <div class="input-group">
                    <input id="txtCode" type="text" placeholder="name/code/category">

                    <input type="button" value="search" onclick="SearchOrder()">
                </div>
                
            </div>


            <div class="row mt-5">
                <td>Search Customer</td>

                <div class="input-group">
                    <input id="txtId" type="text" placeholder="Customer ID / Contact Number">
                    <input type="button" value="search" onclick="SearchCustomer()">
                </div>

            </div>
        </div>

        <div class="mt-5 d-flex mx-auto justify-content-center">
            <input id="txtOid" placeholder="Order id">
            <input id="txtCusName" type="text" placeholder="Customer Name">
            <input id="txtItemName" type="text" placeholder="Enter item name">
            <input id="txtQty" placeholder="Quantity">
            <input id="txtDis" placeholder="Discount">
            <input id="txtpri" placeholder="Price">
            <input id="btnAdd" type="button" value="Add Order" onclick="addOrder()">
            
        </div>


        <div>
            <table id="tblOrder" class="table table-bordered">

            </table>
        </div>

        <script src="js/order.js"></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

            
    </body>
</html>
